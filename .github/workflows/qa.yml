name: QA

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apka-shoper-apilo/package-lock.json
            shopsync-backend/package-lock.json
      - run: npm ci
        working-directory: apka-shoper-apilo
      - run: npm ci
        working-directory: shopsync-backend
      - run: node scripts/qa.mjs
